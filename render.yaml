services:
  - type: web
    name: fedcare-central-backend
    env: python
    region: ohio
    plan: free
    rootDir: central/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fedcare-central-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: fedcare-central-db
    databaseName: central
    user: fedcare_admin
    region: ohio
    plan: free
